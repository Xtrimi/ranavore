<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ranavore</title>
    <link rel="stylesheet" href="config.css" />
  </head>
  <body>
    <div class="popup">
      <div class="header">
        <img src="../icons/icon-48.png" width="36" height="36" />
        <img src="../title.gif" height="36" />
      </div>

      <div class="status-row">
        <div class="status-top">
          <span class="status-label">blocking is</span>
          <span id="status-badge" class="status-badge active">active</span>
        </div>
        
        <button id="toggle">unblock</button>
      </div>

      <hr class="divider"/>

      <p class="section-label">blocked sites</p>
      <ul id="sites-display"></ul>

      <div class="add-row">
        <input id="new-site" type="text" placeholder="example.com" />
        <button id="add">add</button>
      </div>
    </div>
    <script src="config.js"></script>
  </body>
</html>
